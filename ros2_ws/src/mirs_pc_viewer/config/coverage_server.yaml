coverage_server:
  ros__parameters:
    use_sim_time: false
    default_headland_width: 0.2
    robot_width: 0.5
    operation_width: 0.5
    min_turning_radius: 0.25
    linear_curv_change: 200.0
    coordinates_in_cartesian_frame: true
    default_allow_overlap: false
    default_swath_angle_type: "SET_ANGLE"
    default_swath_angle: 0.0
    default_generate_decomp: false
    default_decomp_type: "NONE"
    default_decomp_split_angle: 0.0
